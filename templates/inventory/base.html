<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Учет оборудования</title>
  <style>
    body { background: #f3f6fb; }
    .glass { background: #fff; border: 1px solid #e9eef7; border-radius: 16px; box-shadow: 0 8px 24px rgba(30, 42, 74, .06); }
    .navbar-brand { font-weight: 700; }
    .table thead th { font-size: .85rem; text-transform: uppercase; color: #6c7a92; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container py-2">
    <a class="navbar-brand" href="/">⚙️ Учет оборудования</a>
    <div class="d-flex gap-2 flex-wrap">
      <a class="btn btn-sm btn-outline-primary" href="/equipment/">Оборудование</a>
      <a class="btn btn-sm btn-outline-primary" href="/approvals/">Согласование</a>
      <a class="btn btn-sm btn-outline-primary" href="/clients/">Клиенты</a>
      <a class="btn btn-sm btn-outline-danger" href="/logout/">Выход</a>
    </div>
  </div>
</nav>
<div class="container py-4">
  {% for message in messages %}
    <div class="alert alert-info border-0 shadow-sm">{{ message }}</div>
  {% endfor %}
  <div class="glass p-4">
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
